<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176452" />
    <title>報修登記｜維護服務站</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
    ></script>
    <script defer src="./config.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">＋</span>維護服務站<span
          class="brand-en"
          >REPAIR DESK</span
        >
      </div>
    </header>
    <main>
      <div class="intro">
        <p class="eyebrow">讓問題被看見，讓修復有紀錄</p>
        <h1>報修登記</h1>
        <p>設備故障、網路異常或環境問題，請在這裡告訴我們。</p>
      </div>
      <section class="panel" aria-labelledby="form-title">
        <div class="section-heading">
          <span class="step" aria-hidden="true">01</span>
          <div>
            <h2 id="form-title">新增報修</h2>
            <p>所有欄位皆為必填，請盡量描述問題發生的情況。</p>
          </div>
        </div>
        <p class="demo-note">
          公開示範系統：報修紀錄會公開顯示，請使用虛構姓名與地點。
        </p>
        <form id="repair-form">
          <fieldset id="form-fields" disabled>
            <div class="form-grid">
              <label
                >報修人<input
                  name="reporter_name"
                  required
                  maxlength="80"
                  autocomplete="name"
                  placeholder="例：示範同事"
              /></label>
              <label
                >地點或部門<input
                  name="location"
                  required
                  maxlength="120"
                  placeholder="例：示範辦公室 2 樓"
              /></label>
              <label
                >類別<select name="category" required>
                  <option value="">請選擇問題類別</option>
                  <option>設備</option>
                  <option>網路</option>
                  <option>環境</option>
                  <option>其他</option>
                </select></label
              >
              <label
                >緊急程度<select name="urgency" required>
                  <option value="低">低 — 不影響日常作業</option>
                  <option value="中" selected>中 — 影響部分作業</option>
                  <option value="高">高 — 無法正常作業</option>
                </select></label
              >
              <label class="full-width"
                >問題說明<textarea
                  name="description"
                  required
                  maxlength="2000"
                  rows="5"
                  placeholder="請說明發生什麼問題、發生時間，以及目前的影響…"
                ></textarea
                ><span class="field-hint"
                  >最多 2,000 字，請勿填寫密碼或其他敏感資訊。</span
                ></label
              >
            </div>
            <div class="form-footer">
              <span>送出後將建立一筆報修紀錄</span
              ><button id="submit-button" type="submit">
                送出報修 <span aria-hidden="true">↗</span>
              </button>
            </div>
          </fieldset>
        </form>
        <p
          id="form-message"
          class="message"
          role="status"
          aria-live="polite"
          hidden
        ></p>
      </section>
      <section class="records-section" aria-labelledby="list-title">
        <div class="records-heading">
          <div>
            <p class="eyebrow">維修紀錄</p>
            <h2 id="list-title">最近的報修</h2>
            <p>顯示最近 20 筆紀錄，最新的在最上方。</p>
          </div>
          <button id="refresh-button" type="button" class="secondary" disabled>
            重新整理
          </button>
        </div>
        <div
          class="urgency-filters"
          role="group"
          aria-label="依緊急程度篩選報修"
        >
          <button type="button" data-urgency="全部" aria-pressed="true">
            全部
          </button>
          <button type="button" data-urgency="高" aria-pressed="false">
            高
          </button>
          <button type="button" data-urgency="中" aria-pressed="false">
            中
          </button>
          <button type="button" data-urgency="低" aria-pressed="false">
            低
          </button>
        </div>
        <p id="list-message" class="message" role="status" aria-live="polite">
          正在準備報修清單…
        </p>
        <p
          id="filter-message"
          class="message"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <ol
          id="request-list"
          class="request-list"
          aria-label="最近報修紀錄"
        ></ol>
      </section>
    </main>
    <footer class="site-footer">
      維護服務站 <span>每一次回報，都是更好環境的開始。</span>
    </footer>
  </body>
</html>
